<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ТУТ — Карта встреч</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        .custom-balloon { padding: 10px; max-width: 230px; font-family: sans-serif; }
        .custom-balloon input { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; }
        .custom-balloon button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([56.838926, 60.605702], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        var popup = L.popup();
        map.on('click', function(e) {
            var lat = e.latlng.lat.toFixed(6);
            var lon = e.latlng.lng.toFixed(6);
            popup.setLatLng(e.latlng).setContent(`
                <div class="custom-balloon">
                    <h4>📍 Создать инвайт?</h4>
                    <input type="text" id="pin_desc" placeholder="Что делаем? (Кафе, бар)">
                    <button onclick="createMarker(${lat}, ${lon})">Создать точку</button>
                </div>
            `).openOn(map);
        });

        function createMarker(lat, lon) {
            var desc = document.getElementById('pin_desc').value;
            if (!desc) return alert('Напишите описание!');
            L.marker([lat, lon]).addTo(map).bindPopup(`<b>Ищу компанию:</b> ${desc}`).openPopup();
            map.closePopup();
        }
    </script>
</body>
</html>
