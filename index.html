<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ТЕСТ КАРТЫ</title>
    <!-- Подключаем полностью бесплатную карту Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Создаем карту и центрируем на Екатеринбург
        var map = L.map('map').setView([56.838926, 60.605702], 14);
        
        // Загружаем бесплатную подложку карты мира
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // Ставим одну готовую тестовую точку на Плотинке
        L.marker([56.838926, 60.605702]).addTo(map)
            .bindPopup('<b>ТУТ!</b><br>Тестовая точка работает.')
            .openPopup();
    </script>
</body>
</html>
